<header
  class="sticky top-0 flex w-full bg-white border-[var(--base-border-opaque)] z-99999 dark:border-gray-800 dark:bg-gray-900 xl:border-b shadow-sm">
  <div class="flex flex-col items-center justify-between grow xl:flex-row xl:px-6">
    <div
      class="flex items-center justify-between w-full gap-2 px-3 py-3 border-b border-[var(--base-border-opaque)] dark:border-gray-800 sm:gap-4 xl:justify-normal xl:border-b-0 xl:px-0 lg:py-3.5">
      <!-- Sidebar toggle — Iconsax only, zero SVG -->
      <button
        class="items-center justify-center w-10 h-10 text-[var(--base-content-secondary)] border-[var(--base-border-opaque)] rounded-lg z-99999 dark:border-gray-800 flex hover:bg-[var(--base-bg-secondary)] hover:text-[var(--base-content-primary)] transition-colors duration-150 lg:h-11 lg:w-11 xl:border"
        [ngClass]="{
          'bg-[var(--base-bg-secondary)] text-[var(--base-content-primary)]': isMobileOpen$ | async
        }"
        (click)="handleToggle()" aria-label="Toggle Sidebar">
        @if (isMobileOpen$ | async) {
          <span class="isax-b icon-close-circle text-xl"></span>
        } @else {
          <span class="isax icon-row-horizontal text-xl"></span>
        }
      </button>

      <!-- Mobile menu dots — Iconsax only, zero SVG -->
      <button (click)="toggleApplicationMenu()"
        class="flex items-center justify-center w-10 h-10 text-[var(--base-content-secondary)] rounded-lg z-99999 hover:bg-[var(--base-bg-secondary)] hover:text-[var(--base-content-primary)] transition-colors duration-150 dark:text-gray-400 dark:hover:bg-gray-800 xl:hidden">
        <span class="isax icon-more text-xl"></span>
      </button>
    </div>

    <!-- Right Header Tools -->
    <div [ngClass]="isApplicationMenuOpen ? 'flex' : 'hidden'"
      class="items-center justify-between w-full gap-4 px-5 py-4 xl:flex shadow-theme-md xl:justify-end xl:px-0 xl:shadow-none">
      <div class="flex items-center gap-2 2xsm:gap-3">
        <!-- ThemeToggleButton -->
        <app-theme-toggle-button />
        <!-- NotificationDropdown -->
        <app-notification-dropdown />
      </div>

      <!-- User Info + Logout -->
      <div class="flex items-center gap-3 pl-2 border-l border-gray-200 dark:border-gray-800">
        <!-- Avatar (Base Web Crisp Squircle) -->
        <div class="h-9 w-9 rounded-lg bg-[var(--base-bg-surface-alt)] border border-[var(--base-border-opaque)] text-[var(--base-content-primary)] flex items-center justify-center font-bold text-sm shadow-sm">
          {{ auth.currentUser()?.full_name?.[0] ?? '?' }}
        </div>
        <!-- Name + Role -->
        <div class="hidden lg:block text-left text-xs">
          <p class="font-bold text-[var(--base-content-primary)] dark:text-white leading-tight">{{ auth.currentUser()?.full_name }}</p>
          <span [class]="'inline-flex items-center gap-1 mt-0.5 px-2 py-0.5 rounded text-[10px] font-bold tracking-wide uppercase ' + getRoleBadgeClass(auth.currentRole())">
            <span [class]="getRoleIcon(auth.currentRole()) + ' text-xs'"></span>
            <span>{{ getRoleName(auth.currentRole()) }}</span>
          </span>
        </div>
        <!-- Logout Button -->
        <button
          (click)="handleLogout()"
          title="Đăng xuất"
          class="base-btn base-btn-secondary base-btn-compact ml-1 cursor-pointer"
        >
          <span class="isax icon-logout text-sm"></span>
          <span class="hidden sm:inline">Đăng xuất</span>
        </button>
      </div>
    </div>
  </div>
</header>
