<div class="relative">
  <button (click)="toggleDropdown()" class="flex items-center text-gray-700 dropdown-toggle dark:text-gray-400">
    <span class="mr-3 overflow-hidden rounded-xl h-10 w-10 bg-[var(--base-gray-900)] text-white dark:bg-white dark:text-black flex items-center justify-center font-bold text-sm shadow-sm">
      {{ (auth.currentUser()?.full_name || 'U')[0] }}
    </span>
    <div class="text-left hidden sm:block mr-2">
      <div class="base-label-sm text-[var(--base-content-primary)] leading-none">{{ auth.currentUser()?.full_name || 'Người dùng' }}</div>
      <div class="base-paragraph-xs text-[var(--base-content-secondary)] mt-0.5">{{ auth.currentRoleDisplayName() }}</div>
    </div>
    <span class="isax icon-arrow-down-1 text-xs text-[var(--base-content-tertiary)] transition-transform duration-200" [class.rotate-180]="isOpen"></span>
  </button>

  <app-dropdown [isOpen]="isOpen" (close)="closeDropdown()"
    className="absolute right-0 mt-[17px] flex w-[260px] flex-col rounded-2xl border border-[var(--base-border-opaque)] bg-white p-3 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark">
    <div class="pb-3 border-b border-[var(--base-border-opaque)]">
      <span class="block font-medium text-gray-700 text-theme-sm dark:text-gray-400">
        {{ auth.currentUser()?.full_name || 'Người dùng' }}
      </span>
      <span class="mt-0.5 block text-theme-xs text-gray-500 dark:text-gray-400 font-mono">
        {{ auth.currentUser()?.phone }} • {{ auth.currentRoleDisplayName() }}
      </span>
    </div>

    <ul class="flex flex-col gap-1 pt-3 pb-3 border-b border-[var(--base-border-opaque)]">
      <li>
        <app-dropdown-item-two (itemClick)="closeDropdown()" tag="a" [to]="'/patient/profile'"
          className="flex items-center gap-3 px-3 py-2 font-medium text-gray-700 rounded-lg group text-theme-sm hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">
          <span class="isax icon-user text-base"></span>
          <span>Hồ sơ cá nhân</span>
        </app-dropdown-item-two>
      </li>
    </ul>

    <button
      (click)="handleLogout()"
      class="mt-2 flex items-center gap-2.5 px-3 py-2 font-medium text-[var(--base-negative-primary)] rounded-lg text-theme-sm hover:bg-[var(--base-bg-negative-tint)] transition text-left cursor-pointer">
      <span class="isax icon-logout text-base"></span>
      <span>Đăng xuất</span>
    </button>
  </app-dropdown>
</div>
