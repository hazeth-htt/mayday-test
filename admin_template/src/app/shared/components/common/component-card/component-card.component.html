<div class="base-card {{ className }}">
  <!-- Invoika Card Header -->
  <div class="base-card-header">
    <div>
      <h3 class="base-card-title">
        {{ title }}
      </h3>
      @if (desc) {
      <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
        {{ desc }}
      </p>
      }
    </div>
  </div>

  <!-- Invoika Card Body -->
  <div class="base-card-body">
    <div class="space-y-6">
      <ng-content></ng-content>
    </div>
  </div>
</div>
