<!-- Only render if open -->
@if (isOpen) {
<div class="fixed inset-0 flex items-center justify-center overflow-y-auto z-[99990] p-4">
  <!-- Backdrop -->
  @if (!isFullscreen) {
  <div
    class="fixed inset-0 h-full w-full bg-[#091F5B]/50 backdrop-blur-sm transition-opacity"
    (click)="onBackdropClick($event)"
  ></div>
  }
  <!-- Invoika Modal Dialog / Content -->
  <div
    [ngClass]="isFullscreen ? 'w-full h-full' : 'relative w-full max-w-lg rounded-xl bg-white shadow-2xl border border-gray-200 dark:border-gray-800 dark:bg-[#0b1324] overflow-hidden z-[99999]'"
    [class]="className"
    (click)="onContentClick($event)"
  >
    @if (showCloseButton) {
    <button
      type="button"
      (click)="close.emit()"
      aria-label="Đóng hộp thoại"
      class="absolute right-3.5 top-3.5 z-10 flex h-8 w-8 items-center justify-center rounded-lg text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-700 dark:hover:bg-white/10 dark:hover:text-white"
    >
      <span class="isax icon-close-circle text-xl leading-none"></span>
    </button>
    }
    <div>
      <ng-content></ng-content>
    </div>
  </div>
</div>
}
