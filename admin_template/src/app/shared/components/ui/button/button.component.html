<button
  type="button"
  [ngClass]="
    'inline-flex items-center justify-center gap-2 rounded-lg font-semibold tracking-tight transition-all duration-150 cursor-pointer select-none active:scale-[0.985] ' +
    className + ' ' +
    sizeClasses + ' ' +
    variantClasses + ' ' +
    disabledClasses
  "
  [disabled]="disabled"
  (click)="onClick($event)"
>
  @if (isaxIcon) {
  <span class="isax leading-none" [ngClass]="isaxIcon"></span>
  }
  @if (startIcon) {
  <span class="flex items-center" [innerHTML]="startIcon | safeHtml"></span>
  }
  <ng-content></ng-content>
  @if (endIcon) {
  <span class="flex items-center" [innerHTML]="endIcon | safeHtml"></span>
  }
</button>
