name: DrMayDay Hospital Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-build:
    name: Production Verification & Release Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin_template

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin_template/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Type Checking
        run: npx tsc --noEmit

      - name: Run Unit Tests (Headless Chrome CI)
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI

      - name: Build Production Distribution
        run: npm run build:prod

      - name: Security & Zero-PII Bundle Scan
        run: npm run scan:bundle
